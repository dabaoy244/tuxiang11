<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs>
    <marker id="b" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#3b4351"/></marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="28" y="38" font-size="22" font-weight="700" fill="#1c2026">图 3 · CS-CAM 通道—空间交叉注意力融合</text>
  <text x="28" y="62" font-size="13" fill="#6e7680">解决"低维频域特征被高维空域特征淹没"　｜　对应申报书公式 (13)–(17)　｜　本模块实测 0.309 M 参数（占全模型 1.3%）</text>

  <!-- 输入 -->
  <rect x="28" y="124" width="150" height="60" rx="8" fill="#fdf6f6" stroke="#c62828" stroke-width="1.4"/>
  <text x="103" y="148" font-size="12" font-weight="700" fill="#c62828" text-anchor="middle">F_spa（空域）</text>
  <text x="103" y="168" font-size="10.5" fill="#6e7680" text-anchor="middle">R^896（含 14×14 图形式）</text>

  <rect x="28" y="320" width="150" height="60" rx="8" fill="#f2f8f4" stroke="#1e8449" stroke-width="1.4"/>
  <text x="103" y="344" font-size="12" font-weight="700" fill="#1e8449" text-anchor="middle">F_freq（频域）</text>
  <text x="103" y="364" font-size="10.5" fill="#6e7680" text-anchor="middle">R^256</text>

  <!-- 1x1 conv -->
  <rect x="216" y="112" width="160" height="72" rx="8" fill="#ffffff" stroke="#c9ccd2"/>
  <text x="296" y="138" font-size="12" font-weight="700" fill="#1c2026" text-anchor="middle">1×1 Conv 升维</text>
  <text x="296" y="158" font-size="10.5" fill="#6e7680" text-anchor="middle">896 → 512（公式 13）</text>
  <text x="296" y="174" font-size="10.5" fill="#6e7680" text-anchor="middle">消除维度差异</text>

  <rect x="216" y="308" width="160" height="72" rx="8" fill="#ffffff" stroke="#c9ccd2"/>
  <text x="296" y="334" font-size="12" font-weight="700" fill="#1c2026" text-anchor="middle">1×1 Conv 升维</text>
  <text x="296" y="354" font-size="10.5" fill="#6e7680" text-anchor="middle">256 → 512（公式 14）</text>
  <text x="296" y="370" font-size="10.5" fill="#6e7680" text-anchor="middle">消除维度差异</text>

  <!-- 注意力块 -->
  <rect x="414" y="90" width="212" height="300" rx="10" fill="#f3f4fb" stroke="#3b4351" stroke-width="1.5"/>
  <text x="520" y="116" font-size="13" font-weight="700" fill="#1c2026" text-anchor="middle">注意力权重计算</text>

  <rect x="432" y="132" width="176" height="74" rx="7" fill="#ffffff" stroke="#c9ccd2"/>
  <text x="520" y="154" font-size="11.5" font-weight="700" fill="#1c2026" text-anchor="middle">通道注意力 CA(·)</text>
  <text x="520" y="173" font-size="10" fill="#6e7680" text-anchor="middle">GAP + GMP → 共享 MLP</text>
  <text x="520" y="191" font-size="10" fill="#6e7680" text-anchor="middle">→ 逐通道权重 ∈ R^C</text>

  <rect x="432" y="220" width="176" height="74" rx="7" fill="#ffffff" stroke="#c9ccd2"/>
  <text x="520" y="242" font-size="11.5" font-weight="700" fill="#1c2026" text-anchor="middle">空间注意力 SA(·)</text>
  <text x="520" y="261" font-size="10" fill="#6e7680" text-anchor="middle">沿通道轴 Avg + Max 池化</text>
  <text x="520" y="279" font-size="10" fill="#6e7680" text-anchor="middle">→ 拼接 → 7×7 Conv → Sigmoid</text>

  <rect x="432" y="308" width="176" height="66" rx="7" fill="#fff8e6" stroke="#c47814" stroke-width="1.3"/>
  <text x="520" y="330" font-size="11" font-weight="700" fill="#9a5f10" text-anchor="middle">加权增强</text>
  <text x="520" y="349" font-size="10" fill="#3b4351" text-anchor="middle">F″ = F′ · CA(F′) · SA(F′)</text>
  <text x="520" y="366" font-size="10" fill="#6e7680" text-anchor="middle">公式 15 / 16</text>

  <!-- 融合 -->
  <rect x="676" y="196" width="150" height="88" rx="9" fill="#f2f5f9" stroke="#3b4351" stroke-width="1.5"/>
  <text x="751" y="222" font-size="12.5" font-weight="700" fill="#1c2026" text-anchor="middle">逐元素相加融合</text>
  <text x="751" y="245" font-size="11" fill="#1c2026" text-anchor="middle">F_fusion = F″spa + F″freq</text>
  <text x="751" y="264" font-size="10.5" fill="#6e7680" text-anchor="middle">∈ R^512（公式 17）</text>

  <!-- 输出去向 -->
  <rect x="860" y="120" width="120" height="64" rx="8" fill="#fdf6f6" stroke="#c62828" stroke-width="1.4"/>
  <text x="920" y="144" font-size="11.5" font-weight="700" fill="#c62828" text-anchor="middle">→ 分层 VIB</text>
  <text x="920" y="164" font-size="10" fill="#6e7680" text-anchor="middle">（仅分类支路）</text>
  <rect x="860" y="296" width="120" height="64" rx="8" fill="#f2f8f4" stroke="#1e8449" stroke-width="1.4"/>
  <text x="920" y="320" font-size="11.5" font-weight="700" fill="#1e8449" text-anchor="middle">→ 定位支路</text>
  <text x="920" y="340" font-size="10" fill="#6e7680" text-anchor="middle">Mobile-UNetv2</text>

  <!-- 箭头 -->
  <path d="M178,154 L214,154" stroke="#3b4351" stroke-width="1.6" fill="none" marker-end="url(#b)"/>
  <path d="M178,350 L214,350" stroke="#3b4351" stroke-width="1.6" fill="none" marker-end="url(#b)"/>
  <path d="M376,148 L412,148" stroke="#3b4351" stroke-width="1.6" fill="none" marker-end="url(#b)"/>
  <path d="M376,344 L412,344" stroke="#3b4351" stroke-width="1.6" fill="none" marker-end="url(#b)"/>
  <path d="M520,390 L520,404 L626,404 L626,250 L674,250" stroke="#3b4351" stroke-width="1.6" fill="none" marker-end="url(#b)"/>
  <path d="M826,222 L856,160" stroke="#c62828" stroke-width="1.6" fill="none" marker-end="url(#b)"/>
  <path d="M826,258 L856,320" stroke="#1e8449" stroke-width="1.6" fill="none" marker-end="url(#b)"/>

  <!-- 说明 -->
  <rect x="28" y="424" width="952" height="112" rx="10" fill="#f7f9fc" stroke="#c9ccd2"/>
  <text x="44" y="450" font-size="13" font-weight="700" fill="#1c2026">为什么不能简单拼接？</text>
  <text x="44" y="474" font-size="11.5" fill="#3b4351">空域特征 896 维、频域特征 256 维，量级与分布差异大。直接通道拼接后，低维频域特征在高维空域特征面前"被淹没"——</text>
  <text x="44" y="496" font-size="11.5" fill="#3b4351">模型难以从频域支路获得有效梯度。CS-CAM 先以 1×1 卷积把两者统一到 512 维（消除维度差异），再分别计算通道与空间</text>
  <text x="44" y="516" font-size="11.5" fill="#3b4351">注意力进行加权，最后相加融合——让模型自动学习"这一张图该更信空域还是更信频域"。</text>
  <text x="44" y="534" font-size="11" fill="#9a5f10">注：空间注意力的卷积核取 7×7（CBAM 惯例），申报书原文未写明，此处为补充口径。</text>
</svg>
